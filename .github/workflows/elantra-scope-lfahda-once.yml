name: Scope Elantra LFAHDA once

on:
  push:
    branches:
      - elantra-2024-port-current

permissions:
  contents: write

jobs:
  scope-lfahda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope 8-byte LFAHDA to Elantra 2024-25
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == 1, f"{path}: expected one match, got {count} for {old[:80]!r}"
              p.write_text(text.replace(old, new, 1))

          # Vehicle and safety flags.
          path = "opendbc/car/hyundai/values.py"
          replace_once(path,
              "  FCEV_GAS = 256\n  ALT_LIMITS_2 = 512\n",
              "  FCEV_GAS = 256\n  ALT_LIMITS_2 = 512\n  LFAHDA_8BYTE = 1024\n")
          replace_once(path,
              "  ALT_LIMITS_2 = 2 ** 26\n",
              "  ALT_LIMITS_2 = 2 ** 26\n  LFAHDA_8BYTE = 2 ** 27\n")
          replace_once(path,
              "  HYUNDAI_ELANTRA_2024 = HyundaiPlatformConfig(\n    [HyundaiCarDocs(\"Hyundai Elantra 2024-25\", car_parts=CarParts.common([CarHarness.hyundai_k]))],\n    CarSpecs(mass=2797 * CV.LB_TO_KG, wheelbase=2.72, steerRatio=12.9, tireStiffnessFactor=0.65),\n    flags=HyundaiFlags.CHECKSUM_CRC8 | HyundaiFlags.CAMERA_SCC,\n  )",
              "  HYUNDAI_ELANTRA_2024 = HyundaiPlatformConfig(\n    [HyundaiCarDocs(\"Hyundai Elantra 2024-25\", car_parts=CarParts.common([CarHarness.hyundai_k]))],\n    CarSpecs(mass=2797 * CV.LB_TO_KG, wheelbase=2.72, steerRatio=12.9, tireStiffnessFactor=0.65),\n    flags=HyundaiFlags.CHECKSUM_CRC8 | HyundaiFlags.CAMERA_SCC | HyundaiFlags.LFAHDA_8BYTE,\n  )")
          replace_once(path,
              "  HYUNDAI_ELANTRA_HEV_2024 = HyundaiPlatformConfig(\n    [\n      HyundaiCarDocs(\"Hyundai Elantra Hybrid 2024-25\", car_parts=CarParts.common([CarHarness.hyundai_k])),\n      HyundaiCarDocs(\"Hyundai i30 Hybrid 2024\", car_parts=CarParts.common([CarHarness.hyundai_k])),\n    ],\n    CarSpecs(mass=3017 * CV.LB_TO_KG, wheelbase=2.72, steerRatio=12.9, tireStiffnessFactor=0.65),\n    flags=HyundaiFlags.CHECKSUM_CRC8 | HyundaiFlags.CAMERA_SCC | HyundaiFlags.HYBRID,\n  )",
              "  HYUNDAI_ELANTRA_HEV_2024 = HyundaiPlatformConfig(\n    [\n      HyundaiCarDocs(\"Hyundai Elantra Hybrid 2024-25\", car_parts=CarParts.common([CarHarness.hyundai_k])),\n      HyundaiCarDocs(\"Hyundai i30 Hybrid 2024\", car_parts=CarParts.common([CarHarness.hyundai_k])),\n    ],\n    CarSpecs(mass=3017 * CV.LB_TO_KG, wheelbase=2.72, steerRatio=12.9, tireStiffnessFactor=0.65),\n    flags=HyundaiFlags.CHECKSUM_CRC8 | HyundaiFlags.CAMERA_SCC | HyundaiFlags.HYBRID | HyundaiFlags.LFAHDA_8BYTE,\n  )")

          # Pass the platform-specific flag into panda safety.
          path = "opendbc/car/hyundai/interface.py"
          replace_once(path,
              "    if ret.flags & HyundaiFlags.ALT_LIMITS_2:\n      ret.safetyConfigs[-1].safetyParam |= HyundaiSafetyFlags.ALT_LIMITS_2.value\n\n      # see https://github.com/commaai/opendbc/pull/1137/\n      ret.dashcamOnly = True\n\n    # Common longitudinal control setup\n",
              "    if ret.flags & HyundaiFlags.ALT_LIMITS_2:\n      ret.safetyConfigs[-1].safetyParam |= HyundaiSafetyFlags.ALT_LIMITS_2.value\n\n      # see https://github.com/commaai/opendbc/pull/1137/\n      ret.dashcamOnly = True\n\n    if ret.flags & HyundaiFlags.LFAHDA_8BYTE:\n      ret.safetyConfigs[-1].safetyParam |= HyundaiSafetyFlags.LFAHDA_8BYTE.value\n\n    # Common longitudinal control setup\n")

          # Keep the shared DBC at 4 bytes; pad only the affected platforms when transmitting.
          path = "opendbc/dbc/generator/hyundai/hyundai_can.dbc"
          replace_once(path, "BO_ 1157 LFAHDA_MFC: 8 XXX", "BO_ 1157 LFAHDA_MFC: 4 XXX")

          path = "opendbc/car/hyundai/hyundaican.py"
          replace_once(path,
              "def create_lfahda_mfc(packer, enabled, lfa_icon):\n  values = {\n    \"LFA_Icon_State\": lfa_icon,\n  }\n  return packer.make_can_msg(\"LFAHDA_MFC\", 0, values)\n",
              "def create_lfahda_mfc(packer, enabled, lfa_icon, CP):\n  values = {\n    \"LFA_Icon_State\": lfa_icon,\n  }\n  msg = packer.make_can_msg(\"LFAHDA_MFC\", 0, values)\n  if CP.flags & HyundaiFlags.LFAHDA_8BYTE:\n    addr, dat, bus = msg\n    return addr, dat.ljust(8, b\"\\x00\"), bus\n  return msg\n")

          path = "opendbc/car/hyundai/carcontroller.py"
          replace_once(path,
              "      can_sends.append(hyundaican.create_lfahda_mfc(self.packer, CC.enabled, self.lfa_icon))",
              "      can_sends.append(hyundaican.create_lfahda_mfc(self.packer, CC.enabled, self.lfa_icon, self.CP))")

          # Parse the new safety parameter in the shared Hyundai safety state.
          path = "opendbc/safety/modes/hyundai_common.h"
          replace_once(path,
              "extern bool hyundai_alt_limits_2;\nbool hyundai_alt_limits_2 = false;\n\n// ESCC",
              "extern bool hyundai_alt_limits_2;\nbool hyundai_alt_limits_2 = false;\n\nextern bool hyundai_lfahda_8byte;\nbool hyundai_lfahda_8byte = false;\n\n// ESCC")
          replace_once(path,
              "  const uint16_t HYUNDAI_PARAM_FCEV_GAS = 256;\n  const uint16_t HYUNDAI_PARAM_ALT_LIMITS_2 = 512;\n",
              "  const uint16_t HYUNDAI_PARAM_FCEV_GAS = 256;\n  const uint16_t HYUNDAI_PARAM_ALT_LIMITS_2 = 512;\n  const uint16_t HYUNDAI_PARAM_LFAHDA_8BYTE = 1024;\n")
          replace_once(path,
              "  hyundai_fcev_gas_signal = GET_FLAG(param, HYUNDAI_PARAM_FCEV_GAS);\n  hyundai_alt_limits_2 = GET_FLAG(param, HYUNDAI_PARAM_ALT_LIMITS_2);\n",
              "  hyundai_fcev_gas_signal = GET_FLAG(param, HYUNDAI_PARAM_FCEV_GAS);\n  hyundai_alt_limits_2 = GET_FLAG(param, HYUNDAI_PARAM_ALT_LIMITS_2);\n  hyundai_lfahda_8byte = GET_FLAG(param, HYUNDAI_PARAM_LFAHDA_8BYTE);\n")

          # Default all Hyundai safety modes to the stock 4-byte message, with dedicated 8-byte tables selected only by the new flag.
          path = "opendbc/safety/modes/hyundai.h"
          replace_once(path,
              "#define HYUNDAI_COMMON_TX_MSGS(scc_bus) \\\n  {0x340, 0,       8, .check_relay = true},   /* LKAS11 Bus 0                              */ \\\n  {0x4F1, scc_bus, 4, .check_relay = false},  /* CLU11 Bus 0 (radar-SCC) or 2 (camera-SCC) */ \\\n  {0x485, 0,       8, .check_relay = true},   /* LFAHDA_MFC Bus 0                          */ \\\n\n#define HYUNDAI_LONG_COMMON_TX_MSGS(scc_bus) \\\n  HYUNDAI_COMMON_TX_MSGS(scc_bus) \\\n",
              "#define HYUNDAI_COMMON_TX_MSGS(scc_bus, lfahda_len) \\\n  {0x340, 0,       8, .check_relay = true},   /* LKAS11 Bus 0                              */ \\\n  {0x4F1, scc_bus, 4, .check_relay = false},  /* CLU11 Bus 0 (radar-SCC) or 2 (camera-SCC) */ \\\n  {0x485, 0, lfahda_len, .check_relay = true}, /* LFAHDA_MFC Bus 0                         */ \\\n\n#define HYUNDAI_LONG_COMMON_TX_MSGS(scc_bus, lfahda_len) \\\n  HYUNDAI_COMMON_TX_MSGS(scc_bus, lfahda_len) \\\n")
          replace_once(path,
              "static const CanMsg HYUNDAI_TX_MSGS[] = {\n  HYUNDAI_COMMON_TX_MSGS(0)\n};\n",
              "static const CanMsg HYUNDAI_TX_MSGS[] = {\n  HYUNDAI_COMMON_TX_MSGS(0, 4)\n};\n\nstatic const CanMsg HYUNDAI_LFAHDA_8BYTE_TX_MSGS[] = {\n  HYUNDAI_COMMON_TX_MSGS(0, 8)\n};\n")
          replace_once(path,
              "  static const CanMsg HYUNDAI_LONG_TX_MSGS[] = {\n    HYUNDAI_LONG_COMMON_TX_MSGS(0)\n    {0x38D, 0, 8, .check_relay = false}, // FCA11 Bus 0\n    {0x483, 0, 8, .check_relay = false}, // FCA12 Bus 0\n    {0x7D0, 0, 8, .check_relay = false}, // radar UDS TX addr Bus 0 (for radar disable)\n  };\n\n  static const CanMsg HYUNDAI_CAMERA_SCC_TX_MSGS[] = {\n    HYUNDAI_COMMON_TX_MSGS(2)\n  };\n\n  static const CanMsg HYUNDAI_CAMERA_SCC_LONG_TX_MSGS[] = {\n    HYUNDAI_LONG_COMMON_TX_MSGS(2)\n  };\n\n  static const CanMsg HYUNDAI_LONG_ESCC_TX_MSGS[] = {\n    HYUNDAI_LONG_COMMON_TX_MSGS(0)\n  };\n",
              "  static const CanMsg HYUNDAI_LONG_TX_MSGS[] = {\n    HYUNDAI_LONG_COMMON_TX_MSGS(0, 4)\n    {0x38D, 0, 8, .check_relay = false}, // FCA11 Bus 0\n    {0x483, 0, 8, .check_relay = false}, // FCA12 Bus 0\n    {0x7D0, 0, 8, .check_relay = false}, // radar UDS TX addr Bus 0 (for radar disable)\n  };\n\n  static const CanMsg HYUNDAI_LONG_LFAHDA_8BYTE_TX_MSGS[] = {\n    HYUNDAI_LONG_COMMON_TX_MSGS(0, 8)\n    {0x38D, 0, 8, .check_relay = false}, // FCA11 Bus 0\n    {0x483, 0, 8, .check_relay = false}, // FCA12 Bus 0\n    {0x7D0, 0, 8, .check_relay = false}, // radar UDS TX addr Bus 0 (for radar disable)\n  };\n\n  static const CanMsg HYUNDAI_CAMERA_SCC_TX_MSGS[] = {\n    HYUNDAI_COMMON_TX_MSGS(2, 4)\n  };\n\n  static const CanMsg HYUNDAI_CAMERA_SCC_LFAHDA_8BYTE_TX_MSGS[] = {\n    HYUNDAI_COMMON_TX_MSGS(2, 8)\n  };\n\n  static const CanMsg HYUNDAI_CAMERA_SCC_LONG_TX_MSGS[] = {\n    HYUNDAI_LONG_COMMON_TX_MSGS(2, 4)\n  };\n\n  static const CanMsg HYUNDAI_CAMERA_SCC_LONG_LFAHDA_8BYTE_TX_MSGS[] = {\n    HYUNDAI_LONG_COMMON_TX_MSGS(2, 8)\n  };\n\n  static const CanMsg HYUNDAI_LONG_ESCC_TX_MSGS[] = {\n    HYUNDAI_LONG_COMMON_TX_MSGS(0, 4)\n  };\n\n  static const CanMsg HYUNDAI_LONG_ESCC_LFAHDA_8BYTE_TX_MSGS[] = {\n    HYUNDAI_LONG_COMMON_TX_MSGS(0, 8)\n  };\n")
          replace_once(path,
              "    if (hyundai_escc) {\n      SET_TX_MSGS(HYUNDAI_LONG_ESCC_TX_MSGS, ret);\n    } else if (hyundai_camera_scc) {\n      SET_TX_MSGS(HYUNDAI_CAMERA_SCC_LONG_TX_MSGS, ret);\n    } else {\n      SET_TX_MSGS(HYUNDAI_LONG_TX_MSGS, ret);\n    }\n",
              "    if (hyundai_escc) {\n      if (hyundai_lfahda_8byte) {\n        SET_TX_MSGS(HYUNDAI_LONG_ESCC_LFAHDA_8BYTE_TX_MSGS, ret);\n      } else {\n        SET_TX_MSGS(HYUNDAI_LONG_ESCC_TX_MSGS, ret);\n      }\n    } else if (hyundai_camera_scc) {\n      if (hyundai_lfahda_8byte) {\n        SET_TX_MSGS(HYUNDAI_CAMERA_SCC_LONG_LFAHDA_8BYTE_TX_MSGS, ret);\n      } else {\n        SET_TX_MSGS(HYUNDAI_CAMERA_SCC_LONG_TX_MSGS, ret);\n      }\n    } else {\n      if (hyundai_lfahda_8byte) {\n        SET_TX_MSGS(HYUNDAI_LONG_LFAHDA_8BYTE_TX_MSGS, ret);\n      } else {\n        SET_TX_MSGS(HYUNDAI_LONG_TX_MSGS, ret);\n      }\n    }\n")
          replace_once(path,
              "    ret = BUILD_SAFETY_CFG(hyundai_cam_scc_rx_checks, HYUNDAI_CAMERA_SCC_TX_MSGS);\n",
              "    if (hyundai_lfahda_8byte) {\n      ret = BUILD_SAFETY_CFG(hyundai_cam_scc_rx_checks, HYUNDAI_CAMERA_SCC_LFAHDA_8BYTE_TX_MSGS);\n    } else {\n      ret = BUILD_SAFETY_CFG(hyundai_cam_scc_rx_checks, HYUNDAI_CAMERA_SCC_TX_MSGS);\n    }\n")
          replace_once(path,
              "    SET_TX_MSGS(HYUNDAI_TX_MSGS, ret);\n",
              "    if (hyundai_lfahda_8byte) {\n      SET_TX_MSGS(HYUNDAI_LFAHDA_8BYTE_TX_MSGS, ret);\n    } else {\n      SET_TX_MSGS(HYUNDAI_TX_MSGS, ret);\n    }\n")

          # Regression test: stock camera-SCC remains 4-byte; the new flag flips only 0x485 to 8-byte.
          path = "opendbc/safety/tests/test_hyundai.py"
          replace_once(path,
              "        self._rx(self._acc_state_msg(should_turn_acc_main_on))\n        self.assertEqual(should_turn_acc_main_on, self.safety.get_acc_main_on())\n\n\n@parameterized_class(LDA_BUTTON)\nclass TestHyundaiSafetyFCEV(TestHyundaiSafety):",
              "        self._rx(self._acc_state_msg(should_turn_acc_main_on))\n        self.assertEqual(should_turn_acc_main_on, self.safety.get_acc_main_on())\n\n  def test_lfahda_mfc_8byte_param(self):\n    default_param = self.safety.get_current_safety_param()\n    self.assertTrue(self._tx(common.make_msg(0, 0x485, 4)))\n    self.assertFalse(self._tx(common.make_msg(0, 0x485, 8)))\n\n    try:\n      self.safety.set_safety_hooks(CarParams.SafetyModel.hyundai, HyundaiSafetyFlags.CAMERA_SCC | HyundaiSafetyFlags.LFAHDA_8BYTE)\n      self.safety.init_tests()\n      self.assertFalse(self._tx(common.make_msg(0, 0x485, 4)))\n      self.assertTrue(self._tx(common.make_msg(0, 0x485, 8)))\n    finally:\n      self.safety.set_safety_hooks(CarParams.SafetyModel.hyundai, default_param)\n      self.safety.init_tests()\n\n\n@parameterized_class(LDA_BUTTON)\nclass TestHyundaiSafetyFCEV(TestHyundaiSafety):")
          PY

      - name: Check patch formatting and targeted Hyundai safety tests
        run: |
          git diff --check
          ./test.sh

      - name: Commit scoped compatibility fix
        run: |
          rm .github/workflows/elantra-scope-lfahda-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Hyundai Elantra 2024-25: scope 8-byte LFAHDA safety"
          git push origin HEAD:elantra-2024-port-current
