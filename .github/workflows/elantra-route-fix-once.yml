name: Elantra route fix once

on:
  push:
    branches:
      - elantra-2024-port-current

permissions:
  contents: write

jobs:
  fix-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace stale Elantra HEV test route
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("opendbc/car/tests/routes.py")
          text = path.read_text()
          old = 'CarTestRoute("65ef8b49f9b0dd24/00000141--5c8720a01c", HYUNDAI.HYUNDAI_ELANTRA_HEV_2024),'
          new = 'CarTestRoute("07a48901db7b2503/000001a1--ad07872c4f", HYUNDAI.HYUNDAI_ELANTRA_HEV_2024),'
          assert text.count(old) == 1, f"expected one stale route, found {text.count(old)}"
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit route update
        run: |
          rm .github/workflows/elantra-route-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Hyundai Elantra 2024-25: replace stale HEV test route"
          git push origin HEAD:elantra-2024-port-current
