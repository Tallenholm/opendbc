name: Scope Elantra LFAHDA v2 once

on:
  push:
    branches:
      - elantra-2024-port-current

permissions:
  contents: write

jobs:
  scope-lfahda-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reapply scoped compatibility transform
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/elantra-scope-lfahda-once.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<elantra-scope-transform>', 'exec'))
          PY

      - name: Fix MISRA storage scope
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('opendbc/safety/modes/hyundai.h')
          text = path.read_text()

          old = """static const CanMsg HYUNDAI_TX_MSGS[] = {
            HYUNDAI_COMMON_TX_MSGS(0, 4)
          };

          static const CanMsg HYUNDAI_LFAHDA_8BYTE_TX_MSGS[] = {
            HYUNDAI_COMMON_TX_MSGS(0, 8)
          };
          """
          new = """static const CanMsg HYUNDAI_TX_MSGS[] = {
            HYUNDAI_COMMON_TX_MSGS(0, 4)
          };
          """
          assert text.count(old) == 1, 'expected file-scope 8-byte TX table exactly once'
          text = text.replace(old, new, 1)

          marker = """static safety_config hyundai_init(uint16_t param) {
            static const CanMsg HYUNDAI_LONG_TX_MSGS[] = {
          """
          replacement = """static safety_config hyundai_init(uint16_t param) {
            static const CanMsg HYUNDAI_LFAHDA_8BYTE_TX_MSGS[] = {
              HYUNDAI_COMMON_TX_MSGS(0, 8)
            };

            static const CanMsg HYUNDAI_LONG_TX_MSGS[] = {
          """
          assert text.count(marker) == 1, 'expected hyundai_init marker exactly once'
          path.write_text(text.replace(marker, replacement, 1))
          PY

      - name: Full validation
        run: |
          git diff --check
          ./test.sh

      - name: Commit validated scoped compatibility fix
        run: |
          rm .github/workflows/elantra-scope-lfahda-once.yml
          rm .github/workflows/elantra-scope-lfahda-v2-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Hyundai Elantra 2024-25: scope 8-byte LFAHDA safety"
          git push origin HEAD:elantra-2024-port-current
