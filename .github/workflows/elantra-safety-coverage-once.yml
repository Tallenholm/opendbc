name: Elantra LFAHDA safety coverage once

on:
  push:
    branches:
      - elantra-2024-port-current

permissions:
  contents: write

jobs:
  add-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add targeted safety path coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("opendbc/safety/tests/test_hyundai.py")
          text = path.read_text()
          anchor = "  def test_lfahda_mfc_8byte_param(self):"
          marker = "\n\n@parameterized_class(LDA_BUTTON)\nclass TestHyundaiSafetyFCEV(TestHyundaiSafety):"
          assert "def test_lfahda_mfc_8byte_safety_paths" not in text
          anchor_pos = text.index(anchor)
          marker_pos = text.index(marker, anchor_pos)

          test = '''

  def test_lfahda_mfc_8byte_safety_paths(self):
    default_param = self.safety.get_current_safety_param()
    configs = (
      (HyundaiSafetyFlags.LFAHDA_8BYTE, HyundaiSafetyFlagsSP.DEFAULT),
      (HyundaiSafetyFlags.LONG | HyundaiSafetyFlags.LFAHDA_8BYTE, HyundaiSafetyFlagsSP.DEFAULT),
      (HyundaiSafetyFlags.LONG | HyundaiSafetyFlags.CAMERA_SCC | HyundaiSafetyFlags.LFAHDA_8BYTE, HyundaiSafetyFlagsSP.DEFAULT),
      (HyundaiSafetyFlags.LONG | HyundaiSafetyFlags.LFAHDA_8BYTE, HyundaiSafetyFlagsSP.ESCC),
    )

    try:
      for param, param_sp in configs:
        with self.subTest(param=param, param_sp=param_sp):
          self.safety.set_current_safety_param_sp(param_sp)
          self.safety.set_safety_hooks(CarParams.SafetyModel.hyundai, param)
          self.safety.init_tests()
          self.assertFalse(self._tx(common.make_msg(0, 0x485, 4)))
          self.assertTrue(self._tx(common.make_msg(0, 0x485, 8)))
    finally:
      self.safety.set_current_safety_param_sp(self.SAFETY_PARAM_SP)
      self.safety.set_safety_hooks(CarParams.SafetyModel.hyundai, default_param)
      self.safety.init_tests()
'''
          path.write_text(text[:marker_pos] + test + text[marker_pos:])
          PY

      - name: Run dedicated safety suite with coverage
        run: |
          git diff --check
          ./opendbc/safety/tests/test.sh

      - name: Commit coverage tests
        run: |
          rm .github/workflows/elantra-safety-coverage-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Hyundai Elantra 2024-25: cover scoped LFAHDA safety paths"
          git push origin HEAD:elantra-2024-port-current
