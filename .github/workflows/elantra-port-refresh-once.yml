name: Elantra port refresh once

on:
  push:
    branches:
      - elantra-2024-port-current

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact Elantra compatibility diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3.diff" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/2" \
            -o /tmp/elantra-port.diff

      - name: Validate and apply port patch
        run: |
          git apply --check /tmp/elantra-port.diff
          git apply /tmp/elantra-port.diff
          git diff --check

      - name: Verify exact compatibility scope
        run: |
          expected=$(cat <<'EOF'
          opendbc/car/hyundai/fingerprints.py
          opendbc/car/hyundai/hyundaican.py
          opendbc/car/hyundai/values.py
          opendbc/car/tests/routes.py
          opendbc/car/torque_data/substitute.toml
          opendbc/dbc/generator/hyundai/hyundai_can.dbc
          opendbc/safety/modes/hyundai.h
          opendbc/sunnypilot/car/car_list.json
          EOF
          )
          actual=$(git diff --name-only | sort)
          test "${actual}" = "$(printf '%s\n' "${expected}" | sed 's/^          //' | sort)"

      - name: Commit refreshed port
        run: |
          rm .github/workflows/elantra-port-refresh-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Hyundai Elantra 2024-25: port compatibility onto current master"
          git push origin HEAD:elantra-2024-port-current
